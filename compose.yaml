services:
  db:
    build: ./docker/postgres
    environment:
      POSTGRES_USER: flai
      POSTGRES_PASSWORD: flai
      POSTGRES_DB: flai
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Optional: enables Redis Streams for resumable replies and cross-instance stop (REDIS_URL).
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "56379:6379"

volumes:
  pgdata:

name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build linux amd64 release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install GoFrame CLI
        run: make cli

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Set release version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          test -n "${version}"
          perl -0pi -e "s/arch: \"[^\"]+\"/arch: \"amd64\"/" hack/config.yaml
          perl -0pi -e "s/system: \"[^\"]+\"/system: \"linux\"/" hack/config.yaml
          perl -0pi -e "s/version: \"[^\"]+\"/version: \"${version}\"/" hack/config.yaml
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: make build

      - name: Package linux amd64 binary
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          safe_tag="${tag//\//-}"
          binary="bin/${version}/linux_amd64/flai"
          asset="flai-${safe_tag}-linux-amd64.tar.gz"

          test -x "${binary}"
          tar -czf "${asset}" -C "bin/${version}/linux_amd64" flai
          sha256sum "${asset}" > "${asset}.sha256"

          echo "ASSET=${asset}" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${ASSET}" \
            "${ASSET}.sha256" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "Linux amd64 binary for ${{ steps.version.outputs.tag }}."
